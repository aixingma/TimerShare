<body>

        <div id="create-view" class="terminal-box">

            <form id="timerForm" onsubmit="createTimer(event)">

                <div class="form-row">
                    <div class="form-group">
                        <label for="days">天</label>

                    </div>
                    <div class="form-group">
                        <label for="minutes">分</label>

                    </div>
                    <div class="form-group">

                    </div>
                </div>
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 25px; padding: 15px;">
                    &#x1F680; 开始计时
                </button>
            </form>
            
            <div style="margin-top: 20px; text-align: center; color: #666; font-size: 12px;">
                提示：计时器将立即开始并持续运行。您将获得一个唯一的分享链接。

        <div id="recent-timers" class="recent-timers" style="display:none;">

        <footer style="text-align:center;padding:20px 0;margin-top:30px;border-top:1px solid #333;color:#666;font-size:12px;">

    <div id="modal" class="modal" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <h3 id="modal-title">通知</h3>
            <p id="modal-message">消息</p>
            <button class="btn" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        let currentTimer = null;
        let timerInterval = null;
        const STORAGE_KEY = 'kixtools_recent_timers';

        function encodeTimerData(timerData) {
            return btoa(encodeURIComponent(JSON.stringify(timerData)));
        }
        function decodeTimerData(encoded) {
            try { return JSON.parse(decodeURIComponent(atob(encoded))); }
            catch(e) { return null; }
        }
        function getTimerFromURL() {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get('t');
            return encoded ? decodeTimerData(encoded) : null;
        }
        function createTimerURL(td) {
            return window.location.origin + window.location.pathname + '?t=' + encodeTimerData(td);
        }
        function getRecentTimers() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
            catch(e) { return []; }
        }
        function saveRecentTimer(td) {
            try {
                const recent = getRecentTimers();
                recent.unshift(td);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(recent.slice(0, 15)));
            } catch(e) {}
        }
        function deleteRecentTimer(i) {
            const recent = getRecentTimers();
            recent.splice(i, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(recent));
            renderRecentTimers();
        }
        function formatLocalTime(ts, format) {
            const d = new Date(ts * 1000);
            if (format === 'short') {
                return d.toLocaleDateString('zh-CN', {month:'short',day:'numeric',year:'numeric'}) + ' ' +
                       d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
            }
            return d.toLocaleDateString('zh-CN', {weekday:'short',year:'numeric',month:'short',day:'numeric'}) + ' ' +
                   d.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
        }
        function formatDuration(s) {
            const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
            const p = [];
            if (d > 0) p.push(d + '天');
            if (h > 0) p.push(h + '时');
            if (m > 0) p.push(m + '分');
            if (sec > 0 && d === 0) p.push(sec + '秒');
            return p.length ? p.join(' ') : '0秒';
        }
        function formatCountdown(s) {
            return String(Math.floor(s/3600)).padStart(2,'0') + ':' +
                   String(Math.floor((s%3600)/60)).padStart(2,'0') + ':' +
                   String(s%60).padStart(2,'0');
        }
        function createTimer(e) {
            e.preventDefault();
            const title = document.getElementById('title').value.trim() || '计时器';
            const days = +document.getElementById('days').value || 0;
            const hours = +document.getElementById('hours').value || 0;
            const minutes = +document.getElementById('minutes').value || 0;
            const seconds = +document.getElementById('seconds').value || 0;
            const total = days*86400 + hours*3600 + minutes*60 + seconds;
            if (total <= 0) { showModal('时长无效', '计时器时长必须大于0，请至少输入1秒。'); return; }
            if (total > 365*86400) { showModal('时长过长', '最大计时器时长为365天。'); return; }
            const td = { title, start: Math.floor(Date.now()/1000), duration: total, created: Math.floor(Date.now()/1000) };
            saveRecentTimer(td);
            window.history.pushState({}, '', createTimerURL(td));
            loadTimer(td);
        }
        function loadTimer(td) {
            currentTimer = td;
            document.getElementById('create-view').style.display = 'none';
            document.getElementById('timer-view').style.display = 'block';
            document.getElementById('timer-title').textContent = td.title;
            document.getElementById('timer-start-time').textContent = '开始时间: ' + formatLocalTime(td.start);
            document.getElementById('timer-duration').textContent = formatDuration(td.duration);
            document.getElementById('timer-url').textContent = window.location.href;
            updateTimerDisplay();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimerDisplay, 1000);
        }
        function updateTimerDisplay() {
            if (!currentTimer) return;
            const remaining = Math.max(0, currentTimer.duration - (Math.floor(Date.now()/1000) - currentTimer.start));
            const display = document.getElementById('timer-display');
            if (remaining <= 0) {
                display.textContent = '00:00:00';
                display.classList.add('timer-expired');
                if (!display.hasAttribute('data-notified')) {
                    showModal('计时完成！', '您的计时器已结束。');
                    display.setAttribute('data-notified', 'true');
                }
                clearInterval(timerInterval);
                return;
            }
            display.textContent = formatCountdown(remaining);
        }
        function goHome() {
            if (timerInterval) clearInterval(timerInterval);
            currentTimer = null;
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('timer-view').style.display = 'none';
            document.getElementById('create-view').style.display = 'block';
            renderRecentTimers();
        }
        function renderRecentTimers() {
            const recent = getRecentTimers();
            const container = document.getElementById('recent-timers-list');
            const section = document.getElementById('recent-timers');
            if (!recent.length) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            container.innerHTML = '';
            recent.forEach((timer, i) => {
                const elapsed = Math.floor(Date.now()/1000) - timer.start;
                const remaining = Math.max(0, timer.duration - elapsed);
                const done = remaining <= 0;
                const status = done ? '已完成' : '运行中（剩余 ' + formatCountdown(remaining) + '）';
                const color = done ? '#ff6666' : '#00ff00';
                const url = createTimerURL(timer);
                const item = document.createElement('div');
                item.className = 'timer-item';
                item.innerHTML = '<div><a href="' + url + '">' + escapeHtml(timer.title) + '</a>' +
                    '<div class="timer-status">创建时间: ' + formatLocalTime(timer.created, 'short') +
                    ' | 时长: ' + formatDuration(timer.duration) +
                    ' | 状态: <span style="color:' + color + '">' + status + '</span></div></div>' +
                    '<div class="timer-actions">' +
                    '<button class="btn" onclick="openTimer(\'' + encodeTimerData(timer) + '\')">打开</button>' +
                    '<button class="btn" onclick="deleteTimer(' + i + ')">删除</button></div>';
                container.appendChild(item);
            });
        }
        function openTimer(encoded) {
            const td = decodeTimerData(encoded);
            if (td) window.location.href = createTimerURL(td);
        }
        function deleteTimer(i) { deleteRecentTimer(i); }
        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }
        function showModal(title, message) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('modal').style.display = 'block';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function closeModalOnOutside(e) { if (e.target.id === 'modal') closeModal(); }
        function copyURL() {
            const url = window.location.href;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => showModal('链接已复制！', '计时器链接已复制到剪贴板。'))
                    .catch(() => fallbackCopy(url));
            } else fallbackCopy(url);
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showModal('链接已复制！', '计时器链接已复制到剪贴板。'); }
            catch(e) { showModal('复制失败', '无法复制链接，请从地址栏手动复制。'); }
            document.body.removeChild(ta);
        }
        function toggleFullscreen() {
            const d = document.getElementById('timer-display');
            if (!d) return;
            if (!document.fullscreenElement) {
                d.requestFullscreen().catch(() => showModal('全屏', '浏览器不支持全屏或已被阻止。'));
            } else document.exitFullscreen();
        }
        function init() {
            const td = getTimerFromURL();
            if (td) loadTimer(td); else renderRecentTimers();
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
                else if (e.key === 'c' && e.ctrlKey && currentTimer) { e.preventDefault(); copyURL(); }
                else if (e.key === 'F11' && currentTimer) { e.preventDefault(); toggleFullscreen(); }
            });
            window.addEventListener('popstate', function() {
                const td = getTimerFromURL();
                if (td) loadTimer(td); else goHome();
            });
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
